# Configuration nginx pour le conteneur "web" du labo 07.
# - sert les fichiers statiques (le "build Angular") depuis /usr/share/nginx/html
# - relaie tout ce qui commence par /api/ vers le conteneur "api", port 8080,
#   en le trouvant par son NOM grace au DNS interne du reseau user-defined.
server {
    listen 80;
    listen [::]:80;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    location /api/ {
        proxy_pass http://api:8080/;
    }
}
