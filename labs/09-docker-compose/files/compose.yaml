# Stack du fil rouge : web (nginx) -> api (faux Spring Boot) -> db (PostgreSQL).
# Un seul fichier decrit les trois services, leur reseau, leur volume et
# l'ordre de demarrage (healthchecks). Lance avec : podman compose up -d
name: stack

services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: localhost/api:${API_TAG:-1.0}
    build:
      context: ../05          # le Dockerfile multi-stage du labo 05
    env_file:
      - api.env               # APP_MESSAGE, APP_PROFILE (labo 08)
    environment:
      DB_HOST: db             # le nom du service = le nom DNS
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    image: docker.io/library/nginx:alpine
    ports:
      - "18080:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:

secrets:
  db_password:
    file: ./db_password.txt   # jamais dans git ; cree a l'etape 1 du labo
