# Variante pour l'etape "pod" du labo 07 : les conteneurs d'un pod partagent
# la meme pile reseau, l'API est donc joignable sur localhost:8080.
server {
    listen 80;
    listen [::]:80;

    location / {
        root  /usr/share/nginx/html;
        index index.html;
    }

    location /api/ {
        proxy_pass http://localhost:8080/;
    }
}
